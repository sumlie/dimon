services:
  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile.dev
    env_file: ./apps/bot/.env.local
    ports:
      - "${BOT_PORT}:${BOT_PORT}"
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/bot:/app
      - bot_node_modules:/app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    env_file: ./apps/web/.env.local
    depends_on:
      - bot
    environment:
      NODE_ENV: development
      BOT_HOST: ${BOT_HOST}
      BOT_PORT: ${BOT_PORT}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  bot_node_modules:
  web_node_modules:
  web_next: